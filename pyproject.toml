[project]
name = "lithops"
version = "0.1.0"
description = "A self-calibrating autonomous company operating agent for CEO-Bench."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
agents = [
    "google-adk>=2.1,<3",
]
cloud = [
    "google-auth>=2.35,<3",
    "opentelemetry-exporter-gcp-trace>=1.7,<2",
    "opentelemetry-sdk>=1.27,<2",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/lithops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
